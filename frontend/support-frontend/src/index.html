<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Support Ticket Triage & MCP Filing System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <app-root>
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #030712; color: #a55eea; font-family: 'Outfit', sans-serif; flex-direction: column; gap: 16px;">
      <div style="width: 48px; height: 48px; border: 4px solid #6c5ce7; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div style="font-size: 18px; font-weight: 600; letter-spacing: 0.5px;">Initializing SupportTriage.ai Engine...</div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </app-root>
</body>
</html>
